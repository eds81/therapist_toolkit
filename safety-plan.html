<!-- SAFETY PLAN -->
<section class="safetyplan" id="safetyPlan">
  <div class="section-inner">
    <div class="section-label" data-fade id="spLabel"></div>
    <h2 data-fade data-delay="1" id="spHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="spIntro"></p>
    <div class="goal-banner" data-goal-banner="safetyPlan" hidden></div>

    <div class="sp-crisis-banner" data-fade data-delay="3" id="spCrisisBanner"></div>
    <div class="planner-disclaimer" data-fade data-delay="3" id="spDisclaimer"></div>

    <div class="planner-stepper-row">
      <div class="planner-stepper" id="spStepper"></div>
      <button type="button" class="planner-restart-link" id="spRestartLink"></button>
    </div>

    <div class="planner-step-header" id="spStepHeader">
      <h3 id="spStepTitle"></h3>
      <p id="spStepHint"></p>
    </div>

    <div class="sp-steps" id="spSteps"></div>

    <div class="planner-step-nav" id="spStepNav">
      <button class="btn btn-outline" id="spBackBtn"></button>
      <button class="btn btn-primary" id="spNextBtn"></button>
    </div>

    <div class="planner-review-header" id="spReviewHeader" hidden>
      <h3 id="spReviewHeading"></h3>
      <p id="spReviewIntro"></p>
    </div>

    <div class="planner-actions" id="spActions" hidden>
      <button class="btn btn-primary" id="spDownloadBtn"></button>
      <button class="btn btn-outline" id="spResetBtn"></button>
    </div>
    <p class="planner-empty-state" id="spEmptyState"></p>
    <p class="planner-download-hint" id="spDownloadHint" hidden></p>
  </div>

  <div class="sp-print-sheet" id="spPrintSheet"></div>
</section>
