  <!-- Access gate: this is a UX gate for a prototype, not secure authentication. -->
  <div class="scgate-backdrop" id="scGateBackdrop">
    <div class="scgate-modal" role="dialog" aria-modal="true" aria-labelledby="scGateHeading">
      <button type="button" class="scgate-close" id="scGateClose" aria-label="Close and leave this page">
        <svg class="icon-sm"><use href="#i-x"/></svg>
      </button>
      <div class="scgate-icon" aria-hidden="true"><svg class="icon"><use href="#i-lock"/></svg></div>
      <h2 id="scGateHeading"></h2>
      <p id="scGateIntro"></p>
      <form id="scGateForm" novalidate>
        <label for="scGatePassword" class="scgate-label" id="scGateLabel"></label>
        <input type="password" id="scGatePassword" class="scgate-input" autocomplete="off" />
        <p class="scgate-error" id="scGateError" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary scgate-submit" id="scGateSubmit"></button>
      </form>
    </div>
  </div>

<!-- SELF-CARE -->
<section class="selfcare-page">
  <div class="section-inner" id="scMainContent" hidden>
    <div class="section-label" data-fade id="scLabel"></div>
    <h2 data-fade data-delay="1" id="scHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="scIntro"></p>

    <div class="toolkit-tabs sc-tabs" data-fade data-delay="3" id="scTabsNav"></div>

    <!-- OVERVIEW -->
    <div class="tab-panel active" id="panel-overview">
      <div class="tab-concern" id="scConcern"></div>
      <div class="selfcare-grid" id="scItems"></div>

      <!-- Pre/Post-Session Mindfulness — expandable breathing + prompt practice -->
      <div class="selfcare-sub" id="scMindfulness">
        <h4 id="scMindfulnessHeading"></h4>
        <p class="selfcare-sub-intro" id="scMindfulnessIntro"></p>
        <div class="mindful-grid">
          <div class="mindful-card mindful-pre" id="mindfulPre"></div>
          <div class="mindful-card mindful-post" id="mindfulPost"></div>
        </div>
      </div>
    </div>

    <!-- WHY IT MATTERS -->
    <div class="tab-panel" id="panel-why">
      <p class="selfcare-sub-intro" id="scWhyIntro"></p>
      <div class="why-grid" id="scWhyGrid"></div>

      <blockquote class="mini-quote sc-quote" id="scQuote"></blockquote>

      <h4 class="sc-panel-subhead" id="scTestimonialsHeading"></h4>
      <div class="carousel" data-carousel="selfcare-testimonials">
        <button class="carousel-btn carousel-prev" aria-label="Previous testimonial">
          <svg class="icon"><use href="#i-arrow-left"/></svg>
        </button>
        <div class="carousel-viewport">
          <div class="carousel-track" id="scTestimonialTrack"></div>
        </div>
        <button class="carousel-btn carousel-next" aria-label="Next testimonial">
          <svg class="icon"><use href="#i-arrow-right"/></svg>
        </button>
        <div class="carousel-dots"></div>
      </div>
    </div>

    <!-- WALL OF WINS -->
    <div class="tab-panel" id="panel-wins">
      <p class="selfcare-sub-intro" id="scWowIntro"></p>
      <div class="wow-prototype-note" id="scWowNote">
        <svg class="icon-sm"><use href="#i-help-circle"/></svg>
        <span id="scWowNoteText"></span>
      </div>
      <div class="wow-form">
        <input type="text" id="wowNameInput" class="wow-name-input" />
        <div class="wow-input-row">
          <input type="text" id="wowTextInput" class="wow-text-input" />
          <button type="button" class="btn btn-primary" id="wowSubmitBtn"></button>
        </div>
      </div>
      <div class="wow-grid" id="wowGrid"></div>
    </div>

    <!-- TALK TO SOMEONE -->
    <div class="tab-panel" id="panel-consult">
      <div class="consult-hero">
        <div class="consult-eyebrow" id="scConsultEyebrow"></div>
        <h2 id="scConsultHeading"></h2>
        <p class="consult-lead" id="scConsultIntro"></p>
      </div>

      <div class="consult-need">
        <h3 id="scConsultNeedLabel"></h3>
        <div class="consult-need-pills" id="scConsultNeedPills" role="group" aria-labelledby="scConsultNeedLabel"></div>
        <p class="sr-only" id="scConsultAnnounce" aria-live="polite"></p>
      </div>

      <div class="consult-grid" id="scConsultGrid"></div>
      <p class="consult-placeholder-note" id="scConsultNote"></p>

      <!-- Peer Therapist One-on-One Support -->
      <div class="selfcare-sub" id="peers">
        <h4 id="scPeerHeading"></h4>
        <p class="selfcare-sub-intro" id="scPeerIntro"></p>
        <p class="consult-placeholder-note" id="scPeerNote"></p>
        <div class="peer-grid" id="scPeerGrid"></div>
      </div>
    </div>
  </div>
</section>
