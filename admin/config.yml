              - label: "Who It's For (select all that apply)"
                name: "audience"
                widget: "select"
                multiple: true
                options: ["Clinician", "Youth", "Family", "Community", "Schools"]
              - label: "Theme (select all that apply)"
                name: "theme"
                widget: "select"
                multiple: true
                options: ["Risk Assessment & Safety Planning", "Coping Skills & Emotion Regulation", "Family Engagement", "School Coordination", "Community & Referrals", "Relapse Prevention & Transition", "Engagement & Treatment Process"]
              - {label: "Short Description (for an Evidence-Based Practice, its definition — leave blank to keep it out of the library grid until it's written)", name: "description", widget: "text", required: false}
              - {label: "Why It Works (evidence/research note)", name: "evidence", widget: "text", required: false}
              - {label: "About This Practice (Evidence-Based Practices only — longer write-up shown in the Treatment Library)", name: "details", widget: "text", required: false}
