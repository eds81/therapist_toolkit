                  - {label: "Link Name", name: "label", widget: "string"}
                  - {label: "Web Address (blank = coming soon)", name: "url", widget: "string", required: false}
              - {label: "Source Framework (internal, not shown on the site — e.g. Meza, ECCA)", name: "source", widget: "string", required: false}
              - {label: "Team Review Status (internal, not shown on the site)", name: "reviewStatus", widget: "select", required: false, options: ["Yes", "Maybe", "Probably not", "Undecided"]}
              - label: "Related Resources (Evidence-Based Practices only — titles of other library items)"
