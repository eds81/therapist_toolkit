                  - {label: "Intro (shown under the tabs)", name: "intro", widget: "text"}
                  - {label: "Count word, singular (e.g. practice)", name: "countSingular", widget: "string"}
                  - {label: "Count word, plural (e.g. practices)", name: "countPlural", widget: "string"}
              - label: "Handouts & Tools Tab (every other item)"
                name: "tools"
                widget: "object"
                fields: *reslib_tab_fields
              - {label: "'Write-ups coming soon' Heading", name: "comingSoonHeading", widget: "string"}
              - {label: "'Write-ups coming soon' Note", name: "comingSoonNote", widget: "text"}
              - {label: "No-Results Message", name: "emptyText", widget: "string"}
              - {label: "Audiences not offered as a filter (e.g. Clinician — almost every item is for clinicians)", name: "hiddenAudiences", widget: "list", required: false, field: {label: "Audience", name: "audience", widget: "string"}}
