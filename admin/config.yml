backend:
  name: github
  repo: eds81/therapist_toolkit
  branch: main
  base_url: https://therapist-toolkit-vcoq.vercel.app
  auth_endpoint: api/auth

publish_mode: simple # switch to editorial_workflow later if you want a draft/review step before changes go live

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content/home.json"
        name: "home"
        label: "Home"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Badges", name: "badges", widget: "list", field: {label: "Badge", name: "badge", widget: "string"}}
              - {label: "Headline — Line 1", name: "headlineLine1", widget: "string"}
              - {label: "Headline — Line 2", name: "headlineLine2", widget: "string"}
              - {label: "Subheading", name: "sub", widget: "text", hint: "You can use <em>word</em> to italicize or <strong>word</strong> to bold a word."}
              - label: "Primary Button"
                name: "ctaPrimary"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
              - label: "Secondary Button"
                name: "ctaSecondary"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
              - label: "Stat Cards"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Number (leave blank for a text-only stat)", name: "count", widget: "number", required: false}
                  - {label: "Suffix (e.g. %, %+)", name: "suffix", widget: "string", required: false}
                  - {label: "Text (used instead of Number, e.g. 'Ages 3–19')", name: "text", widget: "string", required: false}
                  - {label: "Label", name: "label", widget: "string"}
          - label: "What's Inside (one card per tool)"
            name: "tour"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "'Use it' Label", name: "useWhenLabel", widget: "string"}
              - {label: "'Open' Link Label", name: "openLabel", widget: "string"}
              - label: "Tools (keep all six keys — each key draws that tool's preview picture)"
                name: "tools"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Key (do not change)", name: "key", widget: "select", options: ["planner", "safety", "library", "community", "schools", "selfcare"]}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "What it does", name: "tagline", widget: "text"}
                  - {label: "When to use it", name: "useWhen", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
          - label: "How It Fits Together (tools in each treatment phase)"
            name: "journey"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Phases (fixed set of 3 — titles and sessions come from About → Treatment Roadmap)"
                name: "phases"
                widget: "list"
                fields:
                  - {label: "What happens in this phase", name: "note", widget: "text"}
                  - {label: "Tools used (by key)", name: "tools", widget: "select", multiple: true, options: ["planner", "safety", "library", "community", "schools", "selfcare"]}
              - {label: "'Throughout' Row Title", name: "throughoutTitle", widget: "string"}
              - label: "Throughout Treatment"
                name: "throughout"
                widget: "list"
                fields:
                  - {label: "Tool (by key)", name: "tool", widget: "select", options: ["planner", "safety", "library", "community", "schools", "selfcare"]}
                  - {label: "Note", name: "note", widget: "string"}
          - label: "Why It Exists (the research cards themselves are edited under About → Why This Toolkit)"
            name: "whySummary"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Link Text", name: "linkText", widget: "string"}
              - {label: "Link Target", name: "linkHref", widget: "string"}
          - label: "Questions Section (heading above the FAQ below)"
            name: "faqSection"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
          - label: "Toolkit FAQ (verbatim client copy, shown on the home page)"
            name: "toolkitFaq"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - label: "1. Goal"
                name: "goal"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - label: "2. Why"
                name: "why"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
              - label: "3. How"
                name: "how"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Concern / Solution Pairs"
                    name: "pairs"
                    widget: "list"
                    fields:
                      - {label: "Therapist Concern", name: "concern", widget: "string"}
                      - {label: "Toolkit Solution", name: "solution", widget: "text"}
              - label: "4. What It Includes"
                name: "includes"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - label: "Items (fixed set of 4 — do not add or remove)"
                    name: "items"
                    widget: "list"
                    fields:
                      - {label: "Letter", name: "letter", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
              - label: "5. How to Use It"
                name: "useIt"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Guidance (fixed set of 4 — do not add or remove)"
                    name: "guidance"
                    widget: "list"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                  - label: "General Tips (add or remove freely)"
                    name: "tips"
                    widget: "list"
                    field: {label: "Tip", name: "tip", widget: "string"}
                  - label: "Closing Line"
                    name: "closing"
                    widget: "object"
                    fields:
                      - {label: "Text Before Link", name: "pre", widget: "string"}
                      - {label: "Link Text", name: "linkText", widget: "string"}
                      - {label: "Link Target", name: "linkHref", widget: "string"}
                      - {label: "Text After Link", name: "post", widget: "string"}

      - file: "content/about.json"
        name: "about"
        label: "About"
        fields:
          - label: "Page Header, Section Links & Closing Call-to-Action"
            name: "aboutPage"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Section Links (the row of links under the header)"
                name: "sectionNav"
                widget: "list"
                summary: "{{label}}"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Target (e.g. #research)", name: "href", widget: "string"}
              - label: "Closing Call-to-Action"
                name: "explore"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
                  - {label: "Primary Button Text", name: "primaryText", widget: "string"}
                  - {label: "Primary Button Link", name: "primaryHref", widget: "string"}
                  - {label: "Secondary Button Text", name: "secondaryText", widget: "string"}
                  - {label: "Secondary Button Link", name: "secondaryHref", widget: "string"}
          - label: "About / Ecosystem Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading — Line 1", name: "headingLine1", widget: "string"}
              - {label: "Heading — Line 2", name: "headingLine2", widget: "string"}
              - {label: "Intro Paragraph", name: "intro", widget: "text"}
              - label: "Partnership Note (short line + link down to Team section)"
                name: "partnershipNote"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link Text", name: "linkText", widget: "string"}
                  - {label: "Link Target (e.g. #team)", name: "linkHref", widget: "string"}
              - {label: "Ecosystem Diagram Hint", name: "ecosystemHint", widget: "string"}
              - label: "Ecosystem Layers (fixed set of 4 — do not add or remove)"
                name: "ecosystemLegend"
                widget: "list"
                fields:
                  - {label: "Layer key (do not change)", name: "layer", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "body", widget: "text"}
                  - {label: "Tags", name: "tags", widget: "list", field: {label: "Tag", name: "tag", widget: "string"}, required: false}
              - label: "Model Steps (fixed set of 4 — do not add or remove)"
                name: "modelSteps"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: &icon_options
                      - i-user
                      - i-users
                      - i-chat
                      - i-check-circle
                      - i-gap
                      - i-shield
                      - i-help-circle
                      - i-zap
                      - i-clipboard
                      - i-map-pin
                      - i-family
                      - i-star
                      - i-file-text
                      - i-school
                      - i-share-2
                      - i-heart
                      - i-play-circle
                      - i-moon
                      - i-calendar
                      - i-code
                      - i-message
                      - i-book
                  - {label: "Color", name: "colorClass", widget: "select", options: ["step-teal", "step-green"]}
                  - {label: "Text", name: "text", widget: "string"}
          - label: "Why This Toolkit Section (its cards also appear in the Home page FAQ)"
            name: "why"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Cards (fixed set of 4 — do not add or remove)"
                name: "cards"
                widget: "list"
                fields:
                  - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                  - {label: "Color", name: "colorClass", widget: "select", options: ["why-icon-red", "why-icon-orange", "why-icon-yellow", "why-icon-teal"]}
                  - {label: "Bold Lead-in", name: "lead", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
                  - {label: "Citation", name: "citation", widget: "string"}
              - label: "Pull Quote"
                name: "pullQuote"
                widget: "object"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
          - label: "Toolkit Section"
            name: "toolkit"
            widget: "object"
            fields:
              - {label: "Section Label (above the Treatment Roadmap heading)", name: "sectionLabel", widget: "string"}
              - label: "Treatment Roadmap (its phase titles and sessions also appear on the Home page and in the Planning Tool)"
                name: "tabs"
                widget: "object"
                fields:
                  - label: "1. Treatment Roadmap"
                    name: "roadmap"
                    widget: "object"
                    fields:
                      - {label: "Short Label (not currently shown)", name: "tabLabel", widget: "string", required: false}
                      - {label: "Heading", name: "heading", widget: "string"}
                      - {label: "Therapist Concern (quoted)", name: "concern", widget: "string", required: false}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Phases (fixed set of 3 — do not add or remove)"
                        name: "phases"
                        widget: "list"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Session Range", name: "sessions", widget: "string"}
                          - {label: "Focus Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
                          - {label: "Sample Interventions", name: "interventions", widget: "list", field: {label: "Intervention", name: "intervention", widget: "string"}}
              - label: "How to Use This Toolkit"
                name: "howToUse"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Steps (fixed set of 4 — do not add or remove)"
                    name: "steps"
                    widget: "list"
                    fields:
                      - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                  - label: "General Tips (add or remove freely)"
                    name: "tips"
                    widget: "list"
                    field: {label: "Tip", name: "tip", widget: "string"}
                  - label: "Feedback Line"
                    name: "feedback"
                    widget: "object"
                    fields:
                      - {label: "Text", name: "text", widget: "text"}
                      - {label: "Link Text", name: "linkText", widget: "string"}
                      - {label: "Link Target", name: "linkHref", widget: "string", hint: "Currently points to #team as a placeholder — update to a real mailto: or contact link when one exists."}
          - label: "Research Section"
            name: "research"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text", hint: "You can use <em>word</em> to italicize a word."}
              - label: "Research Aims (fixed set of 3 — do not add or remove)"
                name: "aims"
                widget: "list"
                fields:
                  - {label: "Number", name: "num", widget: "string"}
                  - {label: "Color", name: "colorClass", widget: "select", options: ["aim-teal", "aim-green", "aim-lime"]}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - {label: "Quotes Heading", name: "quotesHeading", widget: "string"}
              - label: "Therapist Quotes (add or remove freely)"
                name: "quotes"
                widget: "list"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
                  - {label: "Topic Tag", name: "domain", widget: "string"}
          - label: "Team Section"
            name: "team"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Team Members (fixed set of 2 — do not add or remove)"
                name: "members"
                widget: "list"
                fields:
                  - {label: "Logo Style", name: "logoClass", widget: "select", options: ["cu-logo", "rise-logo"]}
                  - {label: "Logo Line 1", name: "logoLine1", widget: "string"}
                  - {label: "Logo Line 2 (optional)", name: "logoLine2", widget: "string", required: false}
                  - {label: "Name", name: "title", widget: "string"}
                  - {label: "Description", name: "body", widget: "text"}
                  - {label: "Funding Tag", name: "fundingTag", widget: "string"}

      - file: "content/planner.json"
        name: "planningTool"
        label: "Planning Tool"
        fields:
          - label: "Planning Tool Section"
            name: "planner"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Disclaimer", name: "disclaimer", widget: "text", hint: "Shown above the tool. Keep this — it's the clinical-judgment safeguard."}
              - {label: "Risk Column Label", name: "riskColumnLabel", widget: "string"}
              - {label: "Protective Column Label", name: "protectiveColumnLabel", widget: "string"}
              - {label: "Eco Map Risk Title (left side of the circle map)", name: "ecoMapRiskLabel", widget: "string"}
              - {label: "Eco Map Protective Title (right side of the circle map)", name: "ecoMapProtectiveLabel", widget: "string"}
              - {label: "Center Label", name: "centerLabel", widget: "string"}
              - {label: "Center Sub-label", name: "centerSub", widget: "string"}
              - label: "Ecological Levels (fixed set of 5 — do not add or remove; order matters)"
                name: "rings"
                widget: "list"
                fields:
                  - {label: "Key (do not change)", name: "key", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Risk Placeholder", name: "placeholderRisk", widget: "string"}
                  - {label: "Protective Placeholder", name: "placeholderProtective", widget: "string"}
              - {label: "Add Button Label", name: "addButtonLabel", widget: "string"}
              - {label: "Step Hint (shown on each of the 5 entry steps)", name: "stepHint", widget: "text"}
              - {label: "Back Button Label", name: "backButtonLabel", widget: "string"}
              - {label: "Next Button Label", name: "nextButtonLabel", widget: "string"}
              - {label: "Review Button Label (shown on the last entry step instead of Next)", name: "reviewButtonLabel", widget: "string"}
              - {label: "Review Step Heading", name: "reviewHeading", widget: "string"}
              - {label: "Review Step Intro", name: "reviewIntro", widget: "text"}
              - {label: "Generate Button Label", name: "generateButtonLabel", widget: "string"}
              - {label: "Reset Button Label", name: "resetButtonLabel", widget: "string"}
              - {label: "Download Button Label", name: "downloadButtonLabel", widget: "string"}
              - {label: "Download Hint", name: "downloadHint", widget: "string"}
              - {label: "Empty State Text", name: "emptyStateText", widget: "string"}
              - label: "Output Panel Headings"
                name: "outputHeadings"
                widget: "object"
                fields:
                  - {label: "Resources Heading", name: "resources", widget: "string"}
                  - {label: "More EBPs Heading", name: "more", widget: "string"}
              - label: "Email My Plan (opt-in — placeholder address, update once real one exists)"
                name: "emailPlan"
                widget: "object"
                fields:
                  - {label: "Button Label", name: "buttonLabel", widget: "string"}
                  - {label: "Email Address", name: "address", widget: "string"}
                  - {label: "Hint Text", name: "hint", widget: "text"}
              - label: "Treatment Goal (reducing suicidal ideation — shown on every step, under each phase on Review, and in the PDF/email)"
                name: "goal"
                widget: "object"
                fields:
                  - {label: "Tag Label", name: "label", widget: "string"}
                  - {label: "Goal Statement", name: "statement", widget: "string"}
                  - label: "Step Reminders"
                    name: "steps"
                    widget: "object"
                    fields:
                      - {label: "Mapping steps (Community → Client)", name: "ring", widget: "text"}
                      - {label: "Identify Top Factors", name: "topFactors", widget: "text"}
                      - {label: "Select Interventions", name: "resourcePlan", widget: "text"}
                      - {label: "Treatment Plan (Review)", name: "review", widget: "text"}
                  - {label: "'In this phase' Label", name: "focusLabel", widget: "string"}
                  - {label: "'Check' Label", name: "checkLabel", widget: "string"}
                  - label: "Phase Goals (fixed set of 3 — Phase 1, 2, 3; each repeats the Goal Statement above)"
                    name: "phases"
                    widget: "list"
                    fields:
                      - {label: "In this phase (how this phase reduces suicidal ideation)", name: "focus", widget: "text"}
                      - {label: "Check (yes/no question for the therapist)", name: "check", widget: "string"}
              - label: "Phase 3 Checklist (shown under Phase 3 on Review and in the printed plan)"
                name: "phase3Checklist"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - {label: "Progress Label (e.g. 'complete' in '2 of 4 complete')", name: "progressLabel", widget: "string"}
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    summary: "{{text}}"
                    fields:
                      - {label: "Activity", name: "text", widget: "string"}
                      - {label: "Detail", name: "detail", widget: "text", required: false}
                      - label: "Links (optional — add one or more)"
                        name: "links"
                        widget: "list"
                        required: false
                        summary: "{{text}}"
                        fields:
                          - {label: "Link Text", name: "text", widget: "string"}
                          - {label: "Link Target (e.g. schools.html)", name: "href", widget: "string"}
              - {label: "Phase Comment Label (Comments box under each Phase 1/2/3 section on Review)", name: "phaseCommentLabel", widget: "string"}
              - {label: "Phase Comment Placeholder", name: "phaseCommentPlaceholder", widget: "string"}
          - label: "Resource Categories (summary cards used by the Planning Tool's recommendations — for the full searchable library, edit the Treatment Library collection instead)"
            name: "resourceCategories"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
              - {label: "Color", name: "colorClass", widget: "select", options: ["lib-teal", "lib-green", "lib-yellow", "lib-purple"]}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}

      - file: "content/safety-plan.json"
        name: "safetyPlan"
        label: "Make A Safety Plan"
        fields:
          - label: "Make A Safety Plan Page"
            name: "safetyPlanPage"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Crisis Banner (always visible at the top of every step)", name: "crisisBanner", widget: "text"}
              - {label: "Disclaimer", name: "disclaimer", widget: "text"}
              - label: "Steps (fixed set of 6 — do not add, remove, or change the Key)"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "Key (do not change)", name: "key", widget: "string"}
                  - {label: "Stepper Label (short — shown in the progress bar)", name: "stepLabel", widget: "string"}
                  - {label: "Step Heading", name: "heading", widget: "string"}
                  - {label: "Step Instructions", name: "intro", widget: "text"}
                  - {label: "Input Placeholder", name: "placeholder", widget: "string"}
                  - {label: "Add Button Label", name: "addButtonLabel", widget: "string"}
              - {label: "Step Hint (shown on each of the 6 entry steps)", name: "stepHint", widget: "text"}
              - {label: "Back Button Label", name: "backButtonLabel", widget: "string"}
              - {label: "Next Button Label", name: "nextButtonLabel", widget: "string"}
              - {label: "Review Button Label (shown on the last entry step instead of Next)", name: "reviewButtonLabel", widget: "string"}
              - {label: "Review Step Heading", name: "reviewHeading", widget: "string"}
              - {label: "Review Step Intro", name: "reviewIntro", widget: "text"}
              - {label: "Download Button Label", name: "downloadButtonLabel", widget: "string"}
              - {label: "Download Hint", name: "downloadHint", widget: "string"}
              - {label: "Reset Button Label", name: "resetButtonLabel", widget: "string"}
              - {label: "Empty State Text", name: "emptyStateText", widget: "string"}

      - file: "content/resources.json"
        name: "resourceLibrary"
        label: "Treatment Library"
        fields:
          - label: "Page Intro"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Subheading", name: "sub", widget: "text"}
              - {label: "PDF Notice", name: "pdfNotice", widget: "text", hint: "Shown at the top of the page — update or remove once PDFs are fully uploaded."}
