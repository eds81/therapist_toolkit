backend:
  name: github
  repo: eds81/therapist_toolkit
  branch: main
  base_url: https://therapist-toolkit-vcoq.vercel.app
  auth_endpoint: api/auth

publish_mode: simple # switch to editorial_workflow later if you want a draft/review step before changes go live

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content/site.json"
        name: "homepage"
        label: "Homepage"
        fields:

          - label: "The Goal (banner shown on the tool pages — reducing suicidal ideation)"
            name: "goal"
            widget: "object"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - label: "Page-Specific Context Lines"
                name: "contexts"
                widget: "object"
                fields:
                  - {label: "About page (Toolkit section)", name: "about", widget: "text"}
                  - {label: "Planning Tool", name: "planner", widget: "text"}
                  - {label: "Make A Safety Plan", name: "safetyPlan", widget: "text"}
                  - {label: "Treatment Library", name: "library", widget: "text"}
                  - {label: "Community Resources", name: "referral", widget: "text"}
                  - {label: "Navigating Schools", name: "schools", widget: "text"}

          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Badges", name: "badges", widget: "list", field: {label: "Badge", name: "badge", widget: "string"}}
              - {label: "Headline — Line 1", name: "headlineLine1", widget: "string"}
              - {label: "Headline — Line 2", name: "headlineLine2", widget: "string"}
              - {label: "Subheading", name: "sub", widget: "text", hint: "You can use <em>word</em> to italicize or <strong>word</strong> to bold a word."}
              - label: "Primary Button"
                name: "ctaPrimary"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
              - label: "Secondary Button"
                name: "ctaSecondary"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
              - label: "Stat Cards"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Number (leave blank for a text-only stat)", name: "count", widget: "number", required: false}
                  - {label: "Suffix (e.g. %, %+)", name: "suffix", widget: "string", required: false}
                  - {label: "Text (used instead of Number, e.g. 'Ages 3–19')", name: "text", widget: "string", required: false}
                  - {label: "Label", name: "label", widget: "string"}

          - label: "Toolkit FAQ (verbatim client copy, shown on the home page)"
            name: "toolkitFaq"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - label: "1. Goal"
                name: "goal"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - label: "2. Why"
                name: "why"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
              - label: "3. How"
                name: "how"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Concern / Solution Pairs"
                    name: "pairs"
                    widget: "list"
                    fields:
                      - {label: "Therapist Concern", name: "concern", widget: "string"}
                      - {label: "Toolkit Solution", name: "solution", widget: "text"}
              - label: "4. What It Includes"
                name: "includes"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - label: "Items (fixed set of 4 — do not add or remove)"
                    name: "items"
                    widget: "list"
                    fields:
                      - {label: "Letter", name: "letter", widget: "string"}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
              - label: "5. How to Use It"
                name: "useIt"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Guidance (fixed set of 4 — do not add or remove)"
                    name: "guidance"
                    widget: "list"
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                  - label: "General Tips (add or remove freely)"
                    name: "tips"
                    widget: "list"
                    field: {label: "Tip", name: "tip", widget: "string"}
                  - label: "Closing Line"
                    name: "closing"
                    widget: "object"
                    fields:
                      - {label: "Text Before Link", name: "pre", widget: "string"}
                      - {label: "Link Text", name: "linkText", widget: "string"}
                      - {label: "Link Target", name: "linkHref", widget: "string"}
                      - {label: "Text After Link", name: "post", widget: "string"}

          - label: "About / Ecosystem Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading — Line 1", name: "headingLine1", widget: "string"}
              - {label: "Heading — Line 2", name: "headingLine2", widget: "string"}
              - {label: "Intro Paragraph", name: "intro", widget: "text"}
              - label: "Partnership Note (short line + link down to Team section)"
                name: "partnershipNote"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "string"}
                  - {label: "Link Text", name: "linkText", widget: "string"}
                  - {label: "Link Target (e.g. #team)", name: "linkHref", widget: "string"}
              - {label: "Ecosystem Diagram Hint", name: "ecosystemHint", widget: "string"}
              - label: "Ecosystem Layers (fixed set of 4 — do not add or remove)"
                name: "ecosystemLegend"
                widget: "list"
                fields:
                  - {label: "Layer key (do not change)", name: "layer", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "body", widget: "text"}
                  - {label: "Tags", name: "tags", widget: "list", field: {label: "Tag", name: "tag", widget: "string"}, required: false}
              - label: "Model Steps (fixed set of 4 — do not add or remove)"
                name: "modelSteps"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: &icon_options
                      - i-user
                      - i-users
                      - i-chat
                      - i-check-circle
                      - i-gap
                      - i-shield
                      - i-help-circle
                      - i-zap
                      - i-clipboard
                      - i-map-pin
                      - i-family
                      - i-star
                      - i-file-text
                      - i-school
                      - i-share-2
                      - i-heart
                      - i-play-circle
                      - i-moon
                      - i-calendar
                      - i-code
                      - i-message
                      - i-book
                  - {label: "Color", name: "colorClass", widget: "select", options: ["step-teal", "step-green"]}
                  - {label: "Text", name: "text", widget: "string"}

          - label: "Why This Toolkit Section"
            name: "why"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Cards (fixed set of 4 — do not add or remove)"
                name: "cards"
                widget: "list"
                fields:
                  - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                  - {label: "Color", name: "colorClass", widget: "select", options: ["why-icon-red", "why-icon-orange", "why-icon-yellow", "why-icon-teal"]}
                  - {label: "Bold Lead-in", name: "lead", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
                  - {label: "Citation", name: "citation", widget: "string"}
              - label: "Pull Quote"
                name: "pullQuote"
                widget: "object"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}

          - label: "Toolkit Section"
            name: "toolkit"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro Paragraph", name: "intro", widget: "text"}
              - {label: "Treatment Library Link Label (button that sends clinicians to the standalone Treatment Library page)", name: "libraryLinkLabel", widget: "string"}
              - {label: "Self-Care Link Label (button that sends clinicians to the standalone Self-Care & Support page)", name: "selfCareLinkLabel", widget: "string"}
              - label: "Tabs"
                name: "tabs"
                widget: "object"
                fields:
                  - label: "1. Treatment Roadmap"
                    name: "roadmap"
                    widget: "object"
                    fields:
                      - {label: "Tab Button Label", name: "tabLabel", widget: "string"}
                      - {label: "Heading", name: "heading", widget: "string"}
                      - {label: "Therapist Concern (quoted)", name: "concern", widget: "string", required: false}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Phases (fixed set of 3 — do not add or remove)"
                        name: "phases"
                        widget: "list"
                        fields:
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Session Range", name: "sessions", widget: "string"}
                          - {label: "Focus Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
                          - {label: "Sample Interventions", name: "interventions", widget: "list", field: {label: "Intervention", name: "intervention", widget: "string"}}
                  - label: "3. Navigating Schools"
                    name: "schools"
                    widget: "object"
                    fields:
                      - {label: "Tab Button Label", name: "tabLabel", widget: "string"}
                      - {label: "Heading", name: "heading", widget: "string"}
                      - {label: "Therapist Concern (quoted)", name: "concern", widget: "string", required: false}
                      - {label: "Intro", name: "intro", widget: "text"}
                      - label: "Pull Quote"
                        name: "quote"
                        widget: "object"
                        fields:
                          - {label: "Quote", name: "text", widget: "text"}
                          - {label: "Citation", name: "cite", widget: "string"}
                      - label: "Items (fixed set of 3 — do not add or remove)"
                        name: "items"
                        widget: "list"
                        fields:
                          - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                          - {label: "Title", name: "title", widget: "string"}
                          - {label: "Body", name: "body", widget: "text"}
              - label: "How to Use This Toolkit"
                name: "howToUse"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Steps (fixed set of 4 — do not add or remove)"
                    name: "steps"
                    widget: "list"
                    fields:
                      - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                  - label: "General Tips (add or remove freely)"
                    name: "tips"
                    widget: "list"
                    field: {label: "Tip", name: "tip", widget: "string"}
                  - label: "Feedback Line"
                    name: "feedback"
                    widget: "object"
                    fields:
                      - {label: "Text", name: "text", widget: "text"}
                      - {label: "Link Text", name: "linkText", widget: "string"}
                      - {label: "Link Target", name: "linkHref", widget: "string", hint: "Currently points to #team as a placeholder — update to a real mailto: or contact link when one exists."}

          - label: "Resource Categories (summary cards used by the Planning Tool's recommendations — for the full searchable library, edit the Treatment Library collection instead)"
            name: "resourceCategories"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
              - {label: "Color", name: "colorClass", widget: "select", options: ["lib-teal", "lib-green", "lib-yellow", "lib-purple"]}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}

          - label: "Self-Care & Support Page"
            name: "selfCarePage"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Therapist Concern (quoted)", name: "concern", widget: "string", required: false}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Pull Quote"
                name: "quote"
                widget: "object"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
              - label: "Items (fixed set of 4 — do not add or remove)"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - label: "Why This Matters"
                name: "why"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Cards (fixed set of 3 — do not add or remove)"
                    name: "cards"
                    widget: "list"
                    fields:
                      - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                      - {label: "Color", name: "colorClass", widget: "select", options: ["why-icon-red", "why-icon-orange", "why-icon-yellow", "why-icon-teal"]}
                      - {label: "Bold Lead-in", name: "lead", widget: "string"}
                      - {label: "Body", name: "body", widget: "text"}
                      - {label: "Citation (leave blank if none)", name: "citation", widget: "string", required: false}
              - {label: "Testimonials Heading", name: "testimonialsHeading", widget: "string"}
              - label: "Testimonials (add or remove freely)"
                name: "testimonials"
                widget: "list"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
                  - {label: "Theme Tag", name: "theme", widget: "string"}
              - label: "Wall of Wins (visual prototype — entries are not saved by visitors)"
                name: "wallOfWins"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - {label: "Prototype Note", name: "prototypeNote", widget: "text", hint: "Shown above the form — update once this is a real, persisted feature."}
                  - {label: "Post Field Placeholder", name: "formPlaceholder", widget: "string"}
                  - {label: "Name Field Placeholder", name: "nameFieldPlaceholder", widget: "string"}
                  - {label: "Submit Button Label", name: "submitLabel", widget: "string"}
                  - {label: "Default Author (used if name left blank)", name: "defaultAuthor", widget: "string"}
                  - label: "Seed Posts (add or remove freely)"
                    name: "seedPosts"
                    widget: "list"
                    fields:
                      - {label: "Author", name: "author", widget: "string"}
                      - {label: "Text", name: "text", widget: "text"}
              - label: "Talk to Someone (placeholder contact links — update once real ones exist)"
                name: "consult"
                widget: "object"
                fields:
                  - {label: "Eyebrow", name: "eyebrow", widget: "string"}
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Need Picker"
                    name: "needPicker"
                    widget: "object"
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - label: "Options (fixed set of 4 — do not add or remove)"
                        name: "options"
                        widget: "list"
                        fields:
                          - {label: "Pill Label", name: "label", widget: "string"}
                          - {label: "Matches Card (peer / tamar / rise — must match a card Key below)", name: "matchKey", widget: "string"}
                  - label: "Contact Cards (fixed set of 3 — do not add or remove)"
                    name: "cards"
                    widget: "list"
                    fields:
                      - {label: "Key (do not change — peer / tamar / rise)", name: "key", widget: "string"}
                      - {label: "Icon", name: "icon", widget: "select", options: *icon_options}
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Subtitle", name: "subtitle", widget: "string"}
                      - label: "Best For (fixed set of 2 — do not add or remove)"
                        name: "bestFor"
                        widget: "list"
                        field: {label: "Item", name: "item", widget: "string"}
                      - {label: "Format", name: "format", widget: "string"}
                      - {label: "Reply Time", name: "reply", widget: "string"}
                      - {label: "Note", name: "note", widget: "string"}
                      - {label: "Button Label", name: "buttonLabel", widget: "string"}
                      - {label: "Mailto (used if no scheduling URL is set)", name: "mailto", widget: "string"}
                      - {label: "Scheduling URL (optional — overrides the mailto on the button)", name: "schedulingUrl", widget: "string", required: false}
                      - {label: "Secondary Line Text", name: "secondaryText", widget: "string"}
                      - {label: "Secondary Line Link (leave blank for plain text, no link)", name: "secondaryHref", widget: "string", required: false}
                  - {label: "Prototype Note", name: "prototypeNote", widget: "text"}

          - label: "Navigating Schools Page"
            name: "schoolsPage"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Pull Quote"
                name: "quote"
                widget: "object"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
              - label: "Tab Labels"
                name: "tabs"
                widget: "object"
                fields:
                  - {label: "Tips", name: "tips", widget: "string"}
                  - {label: "Your Client's School Card", name: "card", widget: "string"}
                  - {label: "Mental Health Contact Card", name: "contact", widget: "string"}
                  - {label: "Rise School Guidelines", name: "guidelines", widget: "string"}
              - label: "Tips"
                name: "tips"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
                  - {label: "Extra Module", name: "widget", widget: "select", options: ["none", "interviewGuide", "roles"], default: "none", hint: "interviewGuide shows the interview questions below this tip; roles shows the Who Does What cards."}
                  - {label: "Link Text (optional)", name: "linkText", widget: "string", required: false}
                  - {label: "Link / File URL (optional — e.g. the ROI form or re-entry guide)", name: "linkHref", widget: "string", required: false}
                  - {label: "Shown When No Link Yet (e.g. 'ROI form coming soon')", name: "pendingText", widget: "string", required: false}
              - label: "Interview Guide (Tip 2)"
                name: "interviewGuide"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Progress Label", name: "progressLabel", widget: "string"}
                  - {label: "Answer Placeholder", name: "answerPlaceholder", widget: "string"}
                  - {label: "Print Button Label", name: "printLabel", widget: "string"}
                  - {label: "Print Hint", name: "printHint", widget: "string"}
                  - {label: "Questions", name: "questions", widget: "list", field: {label: "Question", name: "question", widget: "string"}}
              - {label: "Roles Heading (Tip 3)", name: "rolesHeading", widget: "string"}
              - label: "Roles Picker (Tip 3 — 'Who handles this?' situations)"
                name: "rolesPicker"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "string", required: false}
                  - {label: "Badge on Matching Card", name: "bestFitLabel", widget: "string"}
                  - {label: "Clear Link Label", name: "clearLabel", widget: "string"}
                  - label: "Situations"
                    name: "options"
                    widget: "list"
                    summary: "{{label}}"
                    fields:
                      - {label: "Situation", name: "label", widget: "string"}
                      - {label: "Whose role (role keys)", name: "matchKeys", widget: "select", multiple: true, options: ["rise", "school", "therapist"]}
                      - {label: "Explanation", name: "note", widget: "text"}
              - label: "Roles (Tip 3)"
                name: "roles"
                widget: "list"
                summary: "{{who}}"
                fields:
                  - {label: "Key (rise / school / therapist — used by the picker below)", name: "key", widget: "string"}
                  - {label: "Who", name: "who", widget: "string"}
                  - {label: "Role", name: "role", widget: "text"}
              - label: "Your Client's School Card"
                name: "schoolCard"
                widget: "object"
                fields:
                  - {label: "Intro", name: "intro", widget: "text"}
                  - label: "Fields"
                    name: "fields"
                    widget: "list"
                    summary: "{{label}}"
                    fields:
                      - {label: "Key (unique, no spaces — changing it clears saved values for this field)", name: "key", widget: "string"}
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "Placeholder", name: "placeholder", widget: "string", required: false}
                      - {label: "Type", name: "type", widget: "select", options: ["text", "textarea", "select"]}
                      - {label: "Options (Type = select only)", name: "options", widget: "list", required: false, field: {label: "Option", name: "option", widget: "string"}}
                  - {label: "Interview Answers Heading", name: "interviewHeading", widget: "string"}
                  - {label: "Interview Answers Empty Text", name: "interviewEmpty", widget: "string"}
                  - {label: "Edit Answers Link Label", name: "interviewEditLabel", widget: "string"}
                  - {label: "Map Factors Heading", name: "mapHeading", widget: "string"}
                  - {label: "Map Factors Intro", name: "mapIntro", widget: "string"}
                  - {label: "Map Factors Empty Text", name: "mapEmpty", widget: "string"}
                  - {label: "Planning Tool Link Label", name: "mapLinkLabel", widget: "string"}
                  - {label: "Risk Label", name: "riskLabel", widget: "string"}
                  - {label: "Protective Label", name: "protectiveLabel", widget: "string"}
                  - {label: "Print Button Label", name: "printLabel", widget: "string"}
                  - {label: "Clear Button Label", name: "resetLabel", widget: "string"}
              - label: "Mental Health Contact Card"
                name: "contactCard"
                widget: "object"
                fields:
                  - {label: "Intro", name: "intro", widget: "text"}
                  - {label: "Card Title", name: "title", widget: "string"}
                  - {label: "Therapist Heading", name: "therapistHeading", widget: "string"}
                  - label: "Therapist Fields"
                    name: "therapistFields"
                    widget: "list"
                    summary: "{{label}}"
                    fields:
                      - {label: "Key (unique, no spaces)", name: "key", widget: "string"}
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "Placeholder", name: "placeholder", widget: "string", required: false}
                  - {label: "When to Contact the Therapist — Heading", name: "whenTherapistHeading", widget: "string"}
                  - {label: "When to Contact the Therapist", name: "whenTherapist", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
                  - {label: "Rise Heading", name: "riseHeading", widget: "string"}
                  - {label: "Rise Contact Label (e.g. Email)", name: "riseContactLabel", widget: "string"}
                  - {label: "Rise Contact (email or phone)", name: "riseContact", widget: "string"}
                  - {label: "When to Contact Rise — Heading", name: "whenRiseHeading", widget: "string"}
                  - {label: "When to Contact Rise", name: "whenRise", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
                  - {label: "Crisis Heading", name: "crisisHeading", widget: "string"}
                  - {label: "Crisis Lines", name: "crisis", widget: "list", field: {label: "Line", name: "line", widget: "string"}}
                  - {label: "Local Resources Heading", name: "localHeading", widget: "string"}
                  - {label: "Local Resources Placeholder", name: "localPlaceholder", widget: "string"}
                  - {label: "Print Button Label", name: "printLabel", widget: "string"}
                  - {label: "Prototype Note (leave blank to hide)", name: "prototypeNote", widget: "text", required: false}
              - label: "Rise School Guidelines (Program Manual)"
                name: "guidelines"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Source Line", name: "source", widget: "string"}
                  - {label: "Print Button Label", name: "printLabel", widget: "string"}
                  - {label: "Print Hint (shown next to the button; leave blank to hide)", name: "downloadHint", widget: "string", required: false}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - {label: "Guidelines", name: "items", widget: "list", field: {label: "Guideline", name: "item", widget: "text"}}

          - label: "Planning Tool Section"
            name: "planner"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Disclaimer", name: "disclaimer", widget: "text", hint: "Shown above the tool. Keep this — it's the clinical-judgment safeguard."}
              - {label: "Risk Column Label", name: "riskColumnLabel", widget: "string"}
              - {label: "Protective Column Label", name: "protectiveColumnLabel", widget: "string"}
              - {label: "Eco Map Risk Title (left side of the circle map)", name: "ecoMapRiskLabel", widget: "string"}
              - {label: "Eco Map Protective Title (right side of the circle map)", name: "ecoMapProtectiveLabel", widget: "string"}
              - {label: "Center Label", name: "centerLabel", widget: "string"}
              - {label: "Center Sub-label", name: "centerSub", widget: "string"}
              - label: "Ecological Levels (fixed set of 5 — do not add or remove; order matters)"
                name: "rings"
                widget: "list"
                fields:
                  - {label: "Key (do not change)", name: "key", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Risk Placeholder", name: "placeholderRisk", widget: "string"}
                  - {label: "Protective Placeholder", name: "placeholderProtective", widget: "string"}
              - {label: "Add Button Label", name: "addButtonLabel", widget: "string"}
              - {label: "Step Hint (shown on each of the 5 entry steps)", name: "stepHint", widget: "text"}
              - {label: "Back Button Label", name: "backButtonLabel", widget: "string"}
              - {label: "Next Button Label", name: "nextButtonLabel", widget: "string"}
              - {label: "Review Button Label (shown on the last entry step instead of Next)", name: "reviewButtonLabel", widget: "string"}
              - {label: "Review Step Heading", name: "reviewHeading", widget: "string"}
              - {label: "Review Step Intro", name: "reviewIntro", widget: "text"}
              - {label: "Generate Button Label", name: "generateButtonLabel", widget: "string"}
              - {label: "Reset Button Label", name: "resetButtonLabel", widget: "string"}
              - {label: "Download Button Label", name: "downloadButtonLabel", widget: "string"}
              - {label: "Download Hint", name: "downloadHint", widget: "string"}
              - {label: "Empty State Text", name: "emptyStateText", widget: "string"}
              - label: "Output Panel Headings"
                name: "outputHeadings"
                widget: "object"
                fields:
                  - {label: "Resources Heading", name: "resources", widget: "string"}
                  - {label: "More EBPs Heading", name: "more", widget: "string"}
              - label: "Email My Plan (opt-in — placeholder address, update once real one exists)"
                name: "emailPlan"
                widget: "object"
                fields:
                  - {label: "Button Label", name: "buttonLabel", widget: "string"}
                  - {label: "Email Address", name: "address", widget: "string"}
                  - {label: "Hint Text", name: "hint", widget: "text"}
              - label: "Map Layout Switch (Original / Original, grouped / Separate / Grouped / Grouped + flat lines buttons above the ecological map)"
                name: "mapLayouts"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - label: "Options (fixed set of 5 — do not change the keys)"
                    name: "options"
                    widget: "list"
                    summary: "{{label}}"
                    fields:
                      - {label: "Key (do not change)", name: "key", widget: "string"}
                      - {label: "Button Label", name: "label", widget: "string"}
                      - {label: "Description (shown under the buttons)", name: "hint", widget: "text"}
              - label: "Treatment Goal (reducing suicidal ideation — shown on every step, under each phase on Review, and in the PDF/email)"
                name: "goal"
                widget: "object"
                fields:
                  - {label: "Tag Label", name: "label", widget: "string"}
                  - {label: "Goal Statement", name: "statement", widget: "string"}
                  - label: "Step Reminders"
                    name: "steps"
                    widget: "object"
                    fields:
                      - {label: "Mapping steps (Community → Client)", name: "ring", widget: "text"}
                      - {label: "Identify Top Factors", name: "topFactors", widget: "text"}
                      - {label: "Select Interventions", name: "resourcePlan", widget: "text"}
                      - {label: "Treatment Plan (Review)", name: "review", widget: "text"}
                  - {label: "'In this phase' Label", name: "focusLabel", widget: "string"}
                  - {label: "'Check' Label", name: "checkLabel", widget: "string"}
                  - label: "Phase Goals (fixed set of 3 — Phase 1, 2, 3; each repeats the Goal Statement above)"
                    name: "phases"
                    widget: "list"
                    fields:
                      - {label: "In this phase (how this phase reduces suicidal ideation)", name: "focus", widget: "text"}
                      - {label: "Check (yes/no question for the therapist)", name: "check", widget: "string"}
              - label: "Phase 3 Checklist (shown under Phase 3 on Review and in the printed plan)"
                name: "phase3Checklist"
                widget: "object"
                fields:
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Intro", name: "intro", widget: "text"}
                  - {label: "Progress Label (e.g. 'complete' in '2 of 4 complete')", name: "progressLabel", widget: "string"}
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    summary: "{{text}}"
                    fields:
                      - {label: "Activity", name: "text", widget: "string"}
                      - {label: "Detail", name: "detail", widget: "text", required: false}
                      - {label: "Link Text (optional)", name: "linkText", widget: "string", required: false}
                      - {label: "Link Target (optional)", name: "linkHref", widget: "string", required: false}
              - {label: "Phase Comment Label (Comments box under each Phase 1/2/3 section on Review)", name: "phaseCommentLabel", widget: "string"}
              - {label: "Phase Comment Placeholder", name: "phaseCommentPlaceholder", widget: "string"}

          - label: "Make A Safety Plan Page"
            name: "safetyPlanPage"
            widget: "object"
            fields:
              - {label: "Nav Label", name: "navLabel", widget: "string"}
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "Crisis Banner (always visible at the top of every step)", name: "crisisBanner", widget: "text"}
              - {label: "Disclaimer", name: "disclaimer", widget: "text"}
              - label: "Steps (fixed set of 6 — do not add, remove, or change the Key)"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "Key (do not change)", name: "key", widget: "string"}
                  - {label: "Stepper Label (short — shown in the progress bar)", name: "stepLabel", widget: "string"}
                  - {label: "Step Heading", name: "heading", widget: "string"}
                  - {label: "Step Instructions", name: "intro", widget: "text"}
                  - {label: "Input Placeholder", name: "placeholder", widget: "string"}
                  - {label: "Add Button Label", name: "addButtonLabel", widget: "string"}
              - {label: "Step Hint (shown on each of the 6 entry steps)", name: "stepHint", widget: "text"}
              - {label: "Back Button Label", name: "backButtonLabel", widget: "string"}
              - {label: "Next Button Label", name: "nextButtonLabel", widget: "string"}
              - {label: "Review Button Label (shown on the last entry step instead of Next)", name: "reviewButtonLabel", widget: "string"}
              - {label: "Review Step Heading", name: "reviewHeading", widget: "string"}
              - {label: "Review Step Intro", name: "reviewIntro", widget: "text"}
              - {label: "Download Button Label", name: "downloadButtonLabel", widget: "string"}
              - {label: "Download Hint", name: "downloadHint", widget: "string"}
              - {label: "Reset Button Label", name: "resetButtonLabel", widget: "string"}
              - {label: "Empty State Text", name: "emptyStateText", widget: "string"}

          - label: "Research Section"
            name: "research"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text", hint: "You can use <em>word</em> to italicize a word."}
              - label: "Research Aims (fixed set of 3 — do not add or remove)"
                name: "aims"
                widget: "list"
                fields:
                  - {label: "Number", name: "num", widget: "string"}
                  - {label: "Color", name: "colorClass", widget: "select", options: ["aim-teal", "aim-green", "aim-lime"]}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Body", name: "body", widget: "text"}
              - {label: "Quotes Heading", name: "quotesHeading", widget: "string"}
              - label: "Therapist Quotes (add or remove freely)"
                name: "quotes"
                widget: "list"
                fields:
                  - {label: "Quote", name: "text", widget: "text"}
                  - {label: "Citation", name: "cite", widget: "string"}
                  - {label: "Topic Tag", name: "domain", widget: "string"}

          - label: "Team Section"
            name: "team"
            widget: "object"
            fields:
              - {label: "Section Label", name: "sectionLabel", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - label: "Team Members (fixed set of 2 — do not add or remove)"
                name: "members"
                widget: "list"
                fields:
                  - {label: "Logo Style", name: "logoClass", widget: "select", options: ["cu-logo", "rise-logo"]}
                  - {label: "Logo Line 1", name: "logoLine1", widget: "string"}
                  - {label: "Logo Line 2 (optional)", name: "logoLine2", widget: "string", required: false}
                  - {label: "Name", name: "title", widget: "string"}
                  - {label: "Description", name: "body", widget: "text"}
                  - {label: "Funding Tag", name: "fundingTag", widget: "string"}

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Org Name", name: "orgName", widget: "string"}
              - {label: "Sub Line", name: "subLine", widget: "string"}
              - {label: "Funding Text", name: "fundingText", widget: "string"}

      - file: "content/resources.json"
        name: "resourceLibrary"
        label: "Treatment Library (full searchable page)"
        fields:
          - label: "Page Intro"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Subheading", name: "sub", widget: "text"}
              - {label: "PDF Notice", name: "pdfNotice", widget: "text", hint: "Shown at the top of the page — update or remove once PDFs are fully uploaded."}
          - label: "Search & Filter Labels"
            name: "filters"
            widget: "object"
            fields:
              - {label: "Search Placeholder", name: "searchPlaceholder", widget: "string"}
              - {label: "Audience Filter Label", name: "audienceLabel", widget: "string"}
              - {label: "Type Filter Label", name: "typeLabel", widget: "string"}
              - {label: "Theme Filter Label", name: "themeLabel", widget: "string"}
              - {label: "Clear Filters Label", name: "clearLabel", widget: "string"}
              - label: "Audience Options (must match the Audience values used below)"
                name: "audienceOptions"
                widget: "list"
                field: {label: "Option", name: "option", widget: "string"}
              - label: "Type Options (must match the Type values used below)"
                name: "typeOptions"
                widget: "list"
                field: {label: "Option", name: "option", widget: "string"}
              - label: "Theme Options (must match the Theme values used below)"
                name: "themeOptions"
                widget: "list"
                field: {label: "Option", name: "option", widget: "string"}
          - label: "Resources (add or remove freely)"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Type", name: "type", widget: "select", options: ["Assessment Tool", "Worksheet", "Handout", "Referral List", "Tip Sheet", "Evidence-Based Practice"], hint: "For an Evidence-Based Practice, the Title must match the practice's name on the Planning Tool's Select Interventions step exactly."}
              - label: "Who It's For (select all that apply)"
                name: "audience"
                widget: "select"
                multiple: true
                options: ["Clinician", "Youth", "Family", "Community", "Schools"]
              - label: "Theme (select all that apply)"
                name: "theme"
                widget: "select"
                multiple: true
                options: ["Risk Assessment & Safety Planning", "Coping Skills & Emotion Regulation", "Family Engagement", "School Coordination", "Community & Referrals", "Relapse Prevention & Transition"]
              - {label: "Short Description", name: "description", widget: "text"}
              - {label: "Why It Works (evidence/research note)", name: "evidence", widget: "text"}
              - {label: "About This Practice (Evidence-Based Practices only — longer write-up shown in the Treatment Library)", name: "details", widget: "text", required: false}
              - label: "Related Resources (Evidence-Based Practices only — titles of other library items)"
                name: "relatedResources"
                widget: "list"
                required: false
                field: {label: "Resource title", name: "title", widget: "string"}
              - label: "PDF File"
                name: "fileUrl"
                widget: "file"
                required: false
                media_folder: "/resources"
                public_folder: "/resources"
                hint: "Leave blank until the PDF is ready — the page will show a \"PDF coming soon\" badge instead."
