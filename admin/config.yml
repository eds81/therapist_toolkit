                      - {label: "Prompts", name: "prompts", widget: "list", field: {label: "Prompt", name: "prompt", widget: "string"}}
                  - label: "Post-Session Practice"
                    name: "post"
                    widget: "object"
                    fields: *mindful_fields
              - label: "Peer Therapist One-on-One Support"
                name: "peerTherapists"
