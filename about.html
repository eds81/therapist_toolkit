<!-- WHY -->
<section class="why" id="why">
  <div class="section-inner">
    <div class="section-label" data-fade id="whyLabel"></div>
    <h2 data-fade data-delay="1" id="whyHeading"></h2>
    <div class="why-grid" id="whyGrid"></div>
    <blockquote class="pull-quote" data-fade id="whyPullQuote"></blockquote>
  </div>
</section>

<!-- TOOLKIT -->
<section class="toolkit" id="toolkit">
  <div class="section-inner">
    <div class="section-label" data-fade id="toolkitLabel"></div>
    <h2 data-fade data-delay="1" id="toolkitHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="toolkitIntro"></p>

    <div class="toolkit-tabs" data-fade data-delay="3" id="toolkitTabsNav"></div>

    <div class="tab-panel active" id="tab-roadmap"></div>
    <div class="tab-panel" id="tab-schools"></div>

    <div class="how-to-use" data-fade id="howToUse">
      <h3 id="howToUseHeading"></h3>
      <p class="how-to-use-intro" id="howToUseIntro"></p>
      <div class="how-to-use-steps" id="howToUseSteps"></div>
      <ul class="how-to-use-tips" id="howToUseTips"></ul>
      <p class="how-to-use-feedback" id="howToUseFeedback"></p>
    </div>
  </div>
</section>

<!-- ABOUT / OUR MODEL -->
<section class="about" id="about">
  <div class="section-inner">
    <div class="section-label" data-fade id="aboutLabel"></div>
    <h2 data-fade data-delay="1" id="aboutHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="aboutIntro"></p>
    <p class="partnership-note" data-fade data-delay="2" id="partnershipNote"></p>

    <div class="ecosystem" data-fade data-delay="3">
      <p class="eco-hint" id="ecoHint"></p>
      <div class="eco-layout">

        <!-- SVG DIAGRAM -->
        <div class="eco-diagram">
          <svg viewBox="0 0 280 280" class="eco-svg" id="ecoSvg" role="img" aria-label="Concentric circle diagram showing the support ecosystem around youth">
            <!-- Rings drawn largest-to-smallest so hover targets work naturally -->
            <circle class="eco-ring" data-layer="systems"   cx="140" cy="140" r="130" aria-label="Systems and settings"/>
            <circle class="eco-ring" data-layer="providers" cx="140" cy="140" r="95"  aria-label="Clinical providers"/>
            <circle class="eco-ring" data-layer="network"   cx="140" cy="140" r="60"  aria-label="Close personal network"/>
            <circle class="eco-ring" data-layer="youth"     cx="140" cy="140" r="32"  aria-label="Youth"/>
            <!-- Center label (pointer-events:none so clicks pass through to circle) -->
            <text x="140" y="136" class="eco-center-label" style="pointer-events:none">Youth</text>
            <text x="140" y="150" class="eco-center-sub"   style="pointer-events:none">at the center</text>
          </svg>
        </div>

        <!-- LEGEND -->
        <div class="eco-legend" id="ecoLegend"></div>

      </div>
    </div>

    <div class="model-steps" id="modelSteps"></div>
  </div>
</section>

<!-- RESEARCH -->
<section class="research" id="research">
  <div class="section-inner">
    <div class="section-label" data-fade id="researchLabel"></div>
    <h2 data-fade data-delay="1" id="researchHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="researchIntro"></p>

    <div class="aims-row" id="aimsRow"></div>

    <!-- QUOTE CAROUSEL -->
    <h3 class="quotes-heading" data-fade id="quotesHeading"></h3>
    <div class="carousel" data-carousel="research" data-fade data-delay="1">
      <button class="carousel-btn carousel-prev" aria-label="Previous quote">
        <svg class="icon"><use href="#i-arrow-left"/></svg>
      </button>
      <div class="carousel-viewport">
        <div class="carousel-track"></div>
      </div>
      <button class="carousel-btn carousel-next" aria-label="Next quote">
        <svg class="icon"><use href="#i-arrow-right"/></svg>
      </button>
      <div class="carousel-dots"></div>
    </div>
  </div>
</section>

<!-- TEAM -->
<section class="team" id="team">
  <div class="section-inner">
    <div class="section-label" data-fade id="teamLabel"></div>
    <h2 data-fade data-delay="1" id="teamHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="teamIntro"></p>
    <div class="team-cards" id="teamCards"></div>
  </div>
</section>
