<!-- FIND A REFERRAL -->
<section class="referral-page">
  <div class="section-inner">
    <div class="section-label" data-fade id="refLabel"></div>
    <h2 data-fade data-delay="1" id="refHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="refIntro"></p>
    <p class="referral-page-disclaimer" id="refDisclaimer"></p>

    <form class="referral-form" id="referralForm" role="search" novalidate>
      <label for="referralInput" class="referral-label" id="referralLabel"></label>
      <div class="referral-row">
        <div class="referral-search">
          <svg class="icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="text" id="referralInput" />
        </div>
        <button type="submit" class="btn btn-primary referral-search-btn" id="referralSearchBtn"></button>
      </div>
      <p class="referral-error" id="referralError" role="alert" hidden></p>
    </form>

    <div class="referral-layout">
      <div class="referral-results-col">
        <h4 class="referral-col-heading" id="refResultsHeading"></h4>
        <div class="referral-results" id="referralResults" aria-live="polite"></div>
      </div>
      <div class="referral-map-col">
        <h4 class="referral-col-heading" id="refMapHeading"></h4>
        <div class="referral-map" id="referralMap" role="img" aria-label="Map of referral resource locations"></div>
        <p class="referral-map-caption" id="refMapCaption"></p>
      </div>
    </div>
  </div>
</section>
