<!-- NAVIGATING SCHOOLS -->
<section class="schools-page" id="schoolsPage">
  <div class="section-inner">
    <div class="section-label" data-fade id="schLabel"></div>
    <h2 data-fade data-delay="1" id="schHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="schIntro"></p>
    <div class="goal-banner" data-goal-banner="schools" hidden></div>
    <blockquote class="mini-quote schools-quote" id="schQuote"></blockquote>

    <div class="toolkit-tabs" id="schTabsNav" role="tablist"></div>

    <!-- TIPS -->
    <div class="tab-panel active" id="panel-tips">
      <ol class="schools-tips" id="schTips"></ol>
    </div>

    <!-- CLIENT SCHOOL CARD -->
    <div class="tab-panel" id="panel-card">
      <p class="schools-panel-intro" id="schCardIntro"></p>
      <div class="schools-card-layout">
        <form class="schools-card-form" id="schCardForm" autocomplete="off"></form>
        <aside class="schools-card-side">
          <div class="schools-side-block" id="schCardMap"></div>
          <div class="schools-side-block" id="schCardInterview"></div>
        </aside>
      </div>
      <div class="schools-actions">
        <button type="button" class="btn btn-primary" id="schCardPrintBtn"></button>
        <button type="button" class="btn btn-outline" id="schCardResetBtn"></button>
      </div>
    </div>

    <!-- CONTACT CARD -->
    <div class="tab-panel" id="panel-contact">
      <p class="schools-panel-intro" id="schContactIntro"></p>
      <div class="wow-prototype-note schools-note" id="schContactNote"></div>
      <div class="schools-contact-layout">
        <form class="schools-card-form" id="schContactForm" autocomplete="off"></form>
        <div class="schools-contact-preview" id="schContactPreview" aria-label="Contact card preview"></div>
      </div>
      <div class="schools-actions">
        <button type="button" class="btn btn-primary" id="schContactPrintBtn"></button>
      </div>
    </div>

    <!-- RISE GUIDELINES -->
    <div class="tab-panel" id="panel-guidelines">
      <div class="schools-guidelines" id="schGuidelines"></div>
    </div>
  </div>

  <div class="schools-print-sheet" id="schPrintSheet"></div>
</section>
