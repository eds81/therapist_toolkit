<!-- PLANNER -->
<section class="planner" id="planner">
  <div class="section-inner">
    <div class="section-label" data-fade id="plannerLabel"></div>
    <h2 data-fade data-delay="1" id="plannerHeading"></h2>
    <p class="section-intro" data-fade data-delay="2" id="plannerIntro"></p>

    <div class="planner-disclaimer" data-fade data-delay="3" id="plannerDisclaimer"></div>

    <div class="planner-stepper-row">
      <div class="planner-stepper" id="plannerStepper"></div>
      <button type="button" class="planner-restart-link" id="plannerRestartLink"></button>
    </div>

    <div class="planner-step-header" id="plannerStepHeader">
      <h3 id="plannerStepTitle"></h3>
      <p id="plannerStepHint"></p>
    </div>

    <div class="planner-layout" data-fade data-delay="4" id="plannerLayout">
      <div class="planner-col planner-col-risk">
        <h3 class="planner-col-heading planner-col-heading-risk" id="plannerRiskLabel"></h3>
        <div class="planner-rows" id="plannerRiskRows"></div>
      </div>

      <div class="planner-diagram-wrap">
        <div class="planner-ring-labels" id="plannerRingLabels"></div>
        <svg viewBox="0 0 320 320" class="planner-svg" id="plannerSvg" role="img" aria-label="Concentric circle diagram of client ecological formulation">
          <circle class="planner-ring" data-ring="community" cx="160" cy="160" r="145"/>
          <circle class="planner-ring" data-ring="school"    cx="160" cy="160" r="112"/>
          <circle class="planner-ring" data-ring="family"    cx="160" cy="160" r="79"/>
          <circle class="planner-ring" data-ring="peer"      cx="160" cy="160" r="46"/>
          <circle class="planner-ring" data-ring="client"    cx="160" cy="160" r="22"/>
          <text x="160" y="156" class="planner-center-label" id="plannerCenterLabel" style="pointer-events:none"></text>
          <text x="160" y="170" class="planner-center-sub"   id="plannerCenterSub"   style="pointer-events:none"></text>
        </svg>
      </div>

      <div class="planner-col planner-col-protective">
        <h3 class="planner-col-heading planner-col-heading-protective" id="plannerProtectiveLabel"></h3>
        <div class="planner-rows" id="plannerProtectiveRows"></div>
      </div>

      <svg class="planner-connectors" id="plannerConnectors"></svg>
    </div>

    <div class="planner-step-nav" id="plannerStepNav">
      <button class="btn btn-outline" id="plannerBackBtn"></button>
      <button class="btn btn-primary" id="plannerNextBtn"></button>
    </div>

    <div class="planner-review-header" id="plannerReviewHeader" hidden>
      <h3 id="plannerReviewHeading"></h3>
      <p id="plannerReviewIntro"></p>
    </div>

    <div class="planner-actions" id="plannerActions" hidden>
      <button class="btn btn-primary" id="plannerGenerateBtn"></button>
      <button class="btn btn-outline" id="plannerResetBtn"></button>
      <button class="btn btn-outline" id="plannerDownloadBtn" hidden></button>
    </div>
    <p class="planner-empty-state" id="plannerEmptyState"></p>
    <p class="planner-download-hint" id="plannerDownloadHint" hidden></p>

    <div class="planner-output" id="plannerOutput" hidden>
      <div class="planner-output-block" id="plannerOutputPlan"></div>
      <div class="planner-output-block" id="plannerOutputSafetyPlan"></div>
      <div class="planner-output-block" id="plannerOutputResources"></div>
      <div class="planner-output-block" id="plannerOutputMore"></div>
    </div>
  </div>

  <div class="planner-print-sheet" id="plannerPrintSheet"></div>
</section>
